<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TVBox 接口管理系统 · 点播/直播分类检测增强版</title>
    <!-- AWS SDK v2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1500.0/aws-sdk.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --blue: #1f6feb;
            --green: #238636;
            --red: #da3633;
            --yellow: #d29922;
            --purple: #8957e5;
            --vod-color: #2ea043;
            --live-color: #f0883e;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 新布局：双栏卡片 */
        .settings-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            flex: 1;
            min-width: 250px;
        }
        .card h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }
        .r2-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .r2-row input {
            flex: 1;
            background: #010409;
            border: 1px solid var(--border);
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        button {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            background: #2d333b;
        }
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .btn-purple { background: var(--purple); }
        .btn-vod { background: #1e5e2d; border-left: 3px solid #3fb950; }
        .btn-live { background: #a05c1a; border-left: 3px solid #f0883e; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-ghost:hover { background: rgba(56, 139, 253, 0.1); color: #58a6ff; border-color: #58a6ff; }

        textarea {
            width: 100%;
            background: #010409;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
        }
        .import-area {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            vertical-align: middle;
        }
        th {
            background: #1f242c;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .url-text {
            color: #58a6ff;
            font-size: 12px;
            word-break: break-all;
            text-decoration: none;
            display: inline-block;
            max-width: 260px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .online { color: #3fb950; font-weight: 500; }
        .offline { color: #f85149; }
        .warning-text {
            color: var(--yellow);
            font-size: 10px;
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 4px 8px;
            font-size: 11px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
        }
        .action-btn:hover {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }
        .copy-btn { border-color: #2d6a4f; }
        .copy-btn:hover { background: #2d6a4f; }
        .type-select {
            background: #0d1117;
            color: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .type-select.vod { background: #1e3a2f; color: #7ee787; border-color: #2ea043; }
        .type-select.live { background: #4a2e1a; color: #ffb347; border-color: #f0883e; }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 90%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #010409;
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
        }
        footer {
            margin-top: 24px;
            font-size: 12px;
            text-align: center;
            color: var(--text-secondary);
        }
        @media (max-width: 780px) {
            th, td { font-size: 11px; padding: 8px 4px; }
            .url-text { max-width: 140px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 双栏配置区: R2 + 批量操作 -->
    <div class="settings-panel">
        <div class="card">
            <h3>☁️ Cloudflare R2 同步</h3>
            <div class="r2-row">
                <input type="text" id="r2_endpoint" placeholder="Endpoint (如: xxx.r2.cloudflarestorage.com)">
                <input type="text" id="r2_accessKeyId" placeholder="Access Key ID">
            </div>
            <div class="r2-row">
                <input type="password" id="r2_secretAccessKey" placeholder="Secret Access Key">
                <input type="text" id="r2_bucket" placeholder="Bucket 名称">
            </div>
            <div class="btn-group">
                <button class="btn-green" onclick="syncToR2()">⬆️ 上传至 R2</button>
                <button class="btn-purple" onclick="syncFromR2()">⬇️ 从 R2 下载</button>
                <button class="btn-ghost" onclick="openR2Settings()">📝 保存配置</button>
            </div>
        </div>
        <div class="card">
            <h3>⚡ 批量检测 (按标签)</h3>
            <div class="btn-group">
                <button class="btn-vod" onclick="refreshByType('vod')">🎬 批量刷新点播源</button>
                <button class="btn-live" onclick="refreshByType('live')">📺 批量刷新直播源</button>
                <button class="btn-ghost" onclick="setAllType('vod')">🏷️ 全设为点播</button>
                <button class="btn-ghost" onclick="setAllType('live')">🏷️ 全设为直播</button>
                <button class="btn-red" onclick="clearAll()">🗑️ 清空所有</button>
            </div>
        </div>
    </div>

    <!-- 导入区域 -->
    <div class="import-area">
        <textarea id="urlInput" rows="2" placeholder="批量导入接口地址 (每行一个 URL)&#10;支持 http/https，导入后默认类型为「点播」，可手动修改标签"></textarea>
        <div class="btn-group">
            <button class="btn-blue" onclick="importURLs()">📥 智能导入 (自动去重)</button>
        </div>
        <p class="warning-text">✅ 直播源优化检测：使用多代理 + 宽松状态码判定 (200~399)，大幅降低误报离线。</p>
    </div>

    <!-- 接口列表 -->
    <div style="overflow-x: auto;">
        <table id="sourceTable">
            <thead>
                <tr><th>#</th><th width="150">名称</th><th>接口地址</th><th>类型</th><th>延迟/状态</th><th width="150">操作</th></tr>
            </thead>
            <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;">加载中...</td></tr></tbody>
        </table>
    </div>
    <footer>🔍 检测采用4个稳定CORS代理，直播源判定更宽容 (HTTP 200/206/304等均视为在线) | 点击类型下拉可即时切换点播/直播</footer>
</div>

<!-- R2 配置保存弹窗 (简化版直接保存, 但保留可视化) -->
<div class="overlay" id="overlay" onclick="closeAllModals()"></div>
<div class="modal" id="settingsModal">
    <h3>🔐 保存 R2 配置</h3>
    <input type="text" id="modal_r2_endpoint" placeholder="Endpoint">
    <input type="text" id="modal_r2_accessKeyId" placeholder="Access Key ID">
    <input type="password" id="modal_r2_secretAccessKey" placeholder="Secret Access Key">
    <input type="text" id="modal_r2_bucket" placeholder="Bucket Name">
    <button class="btn-green" style="width:100%; margin-top:12px;" onclick="saveR2Settings()">保存配置</button>
</div>

<!-- 编辑接口 -->
<div class="modal" id="editModal">
    <h3>✏️ 编辑接口</h3>
    <input type="hidden" id="editIndex">
    <input type="text" id="editName" placeholder="接口名称">
    <input type="text" id="editUrl" placeholder="完整 URL">
    <label style="font-size:13px;">接口类型：</label>
    <select id="editType">
        <option value="vod">📽️ 点播源 (VOD)</option>
        <option value="live">📡 直播源 (Live)</option>
    </select>
    <button class="btn-blue" style="width:100%; margin-top:15px;" onclick="submitEdit()">确认修改</button>
</div>

<script>
    // ---------- 全局数据 ----------
    let sources = JSON.parse(localStorage.getItem('tvbox_sources') || '[]');
    let r2Config = JSON.parse(localStorage.getItem('r2_config') || '{}');

    // 确保旧数据有type字段
    function normalizeSources() {
        let changed = false;
        for (let s of sources) {
            if (!s.type) { s.type = 'vod'; changed = true; }
            if (s.status === undefined) { s.status = 'wait'; changed = true; }
            if (s.latency === undefined) s.latency = null;
        }
        if (changed) saveAndRender();
        else renderTable();
    }

    // ---------- 增强版代理池 (更稳定) ----------
    const PROXY_LIST = [
        { name: 'allorigins', url: (target) => `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`, retry: true },
        { name: 'corsproxy', url: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}`, retry: true },
        { name: 'cors-anywhere', url: (target) => `https://cors-anywhere.herokuapp.com/${target}`, retry: false },
        { name: 'thingproxy', url: (target) => `https://thingproxy.freeboard.io/fetch/${target}`, retry: false }
    ];

    /**
     * 智能检测接口 (针对直播源优化)
     * @param {string} targetUrl 
     * @param {string} type   'vod' 或 'live'
     * @returns {Promise<{online: boolean, latency: number}>}
     */
    async function testSingleUrlAdvanced(targetUrl, type, timeoutMs = 8000) {
        if (!targetUrl || !targetUrl.startsWith('http')) {
            return { online: false, latency: 9999 };
        }
        // 直播源使用更长超时和更宽松判断
        const effectiveTimeout = (type === 'live') ? 10000 : 7000;
        // 尝试每个代理
        for (let proxy of PROXY_LIST) {
            const proxyUrl = proxy.url(targetUrl);
            const start = Date.now();
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), effectiveTimeout);
                const response = await fetch(proxyUrl, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: { 'Accept': '*/*' }   // 接受任何内容
                });
                clearTimeout(timeoutId);
                const latency = Date.now() - start;
                // 关键优化：直播源允许 200, 206, 304 等所有2xx/3xx状态码
                if (response.status >= 200 && response.status < 400) {
                    return { online: true, latency: Math.min(latency, 5000) };
                }
                // 对于直播源特别宽容：如果状态码是 403/530 但代理错误, 尝试下一个
                console.warn(`代理${proxy.name}返回${response.status}, 继续`);
            } catch (err) {
                console.debug(`代理${proxy.name}失败:`, err.message);
                // 继续尝试下一个代理
            }
            // 可选: 短暂延迟避免高频
            await new Promise(r => setTimeout(r, 80));
        }
        // 所有代理都失败 -> 离线
        return { online: false, latency: 9999 };
    }

    // 按类型批量刷新
    async function refreshByType(type) {
        const targetIndices = [];
        for (let i = 0; i < sources.length; i++) {
            if (sources[i].type === type) targetIndices.push(i);
        }
        if (targetIndices.length === 0) {
            alert(`当前没有「${type === 'vod' ? '点播' : '直播'}」类型的接口`);
            return;
        }
        for (let idx of targetIndices) {
            sources[idx].status = 'checking';
            sources[idx].latency = null;
        }
        renderTable();

        for (let idx of targetIndices) {
            const item = sources[idx];
            const result = await testSingleUrlAdvanced(item.url, item.type, item.type === 'live' ? 10000 : 7000);
            item.status = result.online ? 'online' : 'offline';
            item.latency = result.online ? result.latency : null;
            renderTable();
            await new Promise(r => setTimeout(r, 120));
        }
        // 排序
        sources.sort((a,b) => {
            const aOn = a.status === 'online';
            const bOn = b.status === 'online';
            if(aOn && !bOn) return -1;
            if(!aOn && bOn) return 1;
            if(aOn && bOn) return (a.latency||9999) - (b.latency||9999);
            return 0;
        });
        saveAndRender();
        const onlineCount = sources.filter(s => s.type === type && s.status === 'online').length;
        alert(`「${type === 'vod' ? '点播' : '直播'}」检测完成！在线: ${onlineCount} / 总数: ${targetIndices.length}`);
    }

    // 单独检测（也使用优化版）
    async function checkSingle(index) {
        if (!sources[index]) return;
        const item = sources[index];
        item.status = 'checking';
        item.latency = null;
        renderTable();
        const result = await testSingleUrlAdvanced(item.url, item.type, item.type === 'live' ? 10000 : 7000);
        item.status = result.online ? 'online' : 'offline';
        item.latency = result.online ? result.latency : null;
        saveAndRender();
        alert(`接口: ${item.name}\n${result.online ? `✅ 在线 | 延迟 ${result.latency}ms` : '❌ 离线 (代理均无法获取有效响应)'}`);
    }

    // 复制链接
    async function copyUrl(url) {
        try {
            await navigator.clipboard.writeText(url);
            alert('✅ 已复制接口地址');
        } catch {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ 已复制');
        }
    }

    // 切换类型
    function updateType(index, newType) {
        if (index >= 0 && index < sources.length && (newType === 'vod' || newType === 'live')) {
            sources[index].type = newType;
            saveAndRender();
        }
    }

    function setAllType(type) {
        if(sources.length === 0) return alert('无接口');
        if(confirm(`将所有接口设为「${type === 'vod' ? '点播' : '直播'}」吗？`)){
            for(let s of sources) s.type = type;
            saveAndRender();
        }
    }

    // 导入 (默认点播)
    function importURLs() {
        const val = document.getElementById('urlInput').value.trim();
        if (!val) return;
        const lines = val.split(/\r?\n/);
        let added = 0, skip = 0;
        for(let line of lines){
            let url = line.trim();
            if(!url.startsWith('http')) continue;
            let name = '';
            try {
                const u = new URL(url);
                name = u.hostname.replace(/^www\./, '');
                if(name.length<3) name = u.pathname.split('/').filter(p=>p).pop() || '接口';
            } catch(e) { name = '未知接口'; }
            if(name.length>30) name = name.slice(0,28)+'..';
            if(sources.some(s=>s.url === url)) { skip++; continue; }
            let finalName = name;
            let cnt=1;
            while(sources.some(s=>s.name === finalName)) finalName = name+'_'+cnt++;
            sources.push({
                name: finalName,
                url: url,
                type: 'vod',
                status: 'wait',
                latency: null
            });
            added++;
        }
        alert(`成功导入 ${added} 个接口 (默认点播)，跳过重复 ${skip} 个`);
        document.getElementById('urlInput').value = '';
        saveAndRender();
    }

    // 编辑相关
    function openEditModal(index) {
        const item = sources[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('editName').value = item.name;
        document.getElementById('editUrl').value = item.url;
        document.getElementById('editType').value = item.type;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('editModal').style.display = 'block';
    }

    function submitEdit() {
        const idx = parseInt(document.getElementById('editIndex').value);
        let newName = document.getElementById('editName').value.trim();
        let newUrl = document.getElementById('editUrl').value.trim();
        let newType = document.getElementById('editType').value;
        if(!newName || !newUrl) return alert('名称和URL不能为空');
        if(!newUrl.startsWith('http')) return alert('URL需以http开头');
        if(sources.some((s,i)=> i!==idx && s.url === newUrl)) return alert('网址已存在');
        if(sources.some((s,i)=> i!==idx && s.name === newName)) return alert('名称已存在');
        sources[idx].name = newName;
        sources[idx].url = newUrl;
        sources[idx].type = newType;
        sources[idx].status = 'wait';
        sources[idx].latency = null;
        closeAllModals();
        saveAndRender();
    }

    function deleteSource(idx) {
        if(confirm(`删除接口 "${sources[idx].name}" ？`)) {
            sources.splice(idx,1);
            saveAndRender();
        }
    }

    function clearAll() {
        if(confirm('⚠️ 清空所有接口，不可恢复')) { sources = []; saveAndRender(); }
    }

    // R2 同步
    function getS3() {
        if(!r2Config.accessKeyId || !r2Config.endpoint || !r2Config.bucket) return null;
        return new AWS.S3({
            endpoint: `https://${r2Config.endpoint}`,
            accessKeyId: r2Config.accessKeyId,
            secretAccessKey: r2Config.secretAccessKey,
            signatureVersion: 'v4',
            region: 'auto'
        });
    }

    async function syncToR2() {
        const s3 = getS3();
        if(!s3) return alert('请先填写并保存 R2 配置');
        try {
            await s3.putObject({
                Bucket: r2Config.bucket,
                Key: "tvbox_data.json",
                Body: JSON.stringify(sources, null, 2),
                ContentType: "application/json"
            }).promise();
            alert('✅ 上传成功');
        } catch(e) { alert('❌ 上传失败: '+e.message); }
    }

    async function syncFromR2() {
        const s3 = getS3();
        if(!s3) return alert('请先填写并保存 R2 配置');
        try {
            const data = await s3.getObject({ Bucket: r2Config.bucket, Key: "tvbox_data.json" }).promise();
            const remote = JSON.parse(new TextDecoder().decode(data.Body));
            if(Array.isArray(remote)) {
                sources = remote;
                normalizeSources();
                saveAndRender();
                alert('✅ 下载成功');
            } else alert('云端数据格式错误');
        } catch(e) { alert('❌ 下载失败: '+e.message); }
    }

    // R2 弹窗配置 (修复无法弹出问题)
    function openR2Settings() {
        // 预先填充当前值
        document.getElementById('modal_r2_endpoint').value = r2Config.endpoint || '';
        document.getElementById('modal_r2_accessKeyId').value = r2Config.accessKeyId || '';
        document.getElementById('modal_r2_secretAccessKey').value = r2Config.secretAccessKey || '';
        document.getElementById('modal_r2_bucket').value = r2Config.bucket || '';
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('settingsModal').style.display = 'block';
    }

    function saveR2Settings() {
        const endpoint = document.getElementById('modal_r2_endpoint').value.trim();
        const accessKeyId = document.getElementById('modal_r2_accessKeyId').value.trim();
        const secretAccessKey = document.getElementById('modal_r2_secretAccessKey').value.trim();
        const bucket = document.getElementById('modal_r2_bucket').value.trim();
        if(!endpoint || !accessKeyId || !secretAccessKey || !bucket) {
            alert('请填写完整的 R2 信息');
            return;
        }
        r2Config = { endpoint, accessKeyId, secretAccessKey, bucket };
        localStorage.setItem('r2_config', JSON.stringify(r2Config));
        // 同步到主界面的输入框（方便查看）
        document.getElementById('r2_endpoint').value = endpoint;
        document.getElementById('r2_accessKeyId').value = accessKeyId;
        document.getElementById('r2_secretAccessKey').value = secretAccessKey;
        document.getElementById('r2_bucket').value = bucket;
        closeAllModals();
        alert('R2 配置已保存');
    }

    // UI 渲染 (含类型下拉)
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if(!sources.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px;">暂无接口，请从上方导入或同步R2</td></tr>';
            return;
        }
        tbody.innerHTML = sources.map((item, idx) => {
            const isHttp = item.url && item.url.startsWith('http:');
            let statusText = '';
            let statusClass = '';
            if (item.status === 'online') {
                statusText = `${item.latency}ms`;
                statusClass = 'online';
            } else if (item.status === 'offline') {
                statusText = '离线';
                statusClass = 'offline';
            } else if (item.status === 'checking') {
                statusText = '检测中...';
            } else {
                statusText = '待检测';
            }
            const dotColor = item.status === 'online' ? '#3fb950' : (item.status === 'checking' ? '#d29922' : '#f85149');
            const typeVal = item.type === 'live' ? 'live' : 'vod';
            const typeClass = typeVal === 'vod' ? 'type-select vod' : 'type-select live';
            const safeName = escapeHtml(item.name);
            const safeUrl = escapeHtml(item.url);
            return `
            <tr>
                <td>${idx+1}</td>
                <td><strong>${safeName}</strong>${isHttp ? '<div class="warning-text">⚠️ HTTP源</div>' : ''}</td>
                <td><a class="url-text" href="${item.url}" target="_blank" rel="noopener noreferrer" title="${safeUrl}">${safeUrl.length > 60 ? safeUrl.slice(0,55)+'...' : safeUrl}</a></td>
                <td>
                    <select class="${typeClass}" onchange="updateType(${idx}, this.value)">
                        <option value="vod" ${typeVal === 'vod' ? 'selected' : ''}>📽️ 点播</option>
                        <option value="live" ${typeVal === 'live' ? 'selected' : ''}>📡 直播</option>
                    </select>
                </td>
                <td class="${statusClass}"><span class="status-dot" style="background:${dotColor}"></span> ${statusText}</td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn" onclick="checkSingle(${idx})">🔍 检测</button>
                        <button class="action-btn copy-btn" onclick="copyUrl('${safeUrl.replace(/'/g, "\\'")}')">📋 复制</button>
                        <button class="action-btn" onclick="openEditModal(${idx})">✏️ 编辑</button>
                        <button class="action-btn" style="border-color:#da3633;" onclick="deleteSource(${idx})">🗑️ 删除</button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }

    function saveAndRender() {
        localStorage.setItem('tvbox_sources', JSON.stringify(sources));
        renderTable();
    }

    function closeAllModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
    }

    // 初始化显示已有R2配置
    function initR2Fields() {
        if(r2Config.endpoint) {
            document.getElementById('r2_endpoint').value = r2Config.endpoint;
            document.getElementById('r2_accessKeyId').value = r2Config.accessKeyId;
            document.getElementById('r2_secretAccessKey').value = r2Config.secretAccessKey;
            document.getElementById('r2_bucket').value = r2Config.bucket;
        }
    }

    // 挂载全局函数
    window.refreshByType = refreshByType;
    window.checkSingle = checkSingle;
    window.updateType = updateType;
    window.setAllType = setAllType;
    window.copyUrl = copyUrl;
    window.importURLs = importURLs;
    window.openEditModal = openEditModal;
    window.submitEdit = submitEdit;
    window.deleteSource = deleteSource;
    window.clearAll = clearAll;
    window.syncToR2 = syncToR2;
    window.syncFromR2 = syncFromR2;
    window.openR2Settings = openR2Settings;
    window.saveR2Settings = saveR2Settings;
    window.closeAllModals = closeAllModals;

    initR2Fields();
    normalizeSources();
</script>
</body>
</html>
