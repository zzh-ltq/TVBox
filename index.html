<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TVBox 接口管理系统 v3.0 - 稳定检测版</title>
    <!-- AWS SDK v2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1500.0/aws-sdk.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --blue: #1f6feb;
            --green: #238636;
            --red: #da3633;
            --yellow: #d29922;
            --purple: #8957e5;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            background: #2d333b;
        }
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .btn-purple { background: var(--purple); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-ghost:hover { background: rgba(56, 139, 253, 0.1); color: #58a6ff; border-color: #58a6ff; }

        textarea {
            width: 100%;
            height: 80px;
            background: #010409;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            vertical-align: middle;
        }
        th {
            background: #1f242c;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .url-text {
            color: #58a6ff;
            font-size: 12px;
            word-break: break-all;
            text-decoration: none;
            display: inline-block;
            max-width: 280px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .online { color: #3fb950; font-weight: 500; }
        .offline { color: #f85149; }
        .warning-text {
            color: var(--yellow);
            font-size: 10px;
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 4px 8px;
            font-size: 11px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            color: var(--text);
        }
        .action-btn:hover {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }
        .copy-btn { border-color: #2d6a4f; }
        .copy-btn:hover { background: #2d6a4f; border-color: #2d6a4f; }
        .check-single-btn { border-color: var(--purple); }
        .check-single-btn:hover { background: var(--purple); }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 999;
        }
        .modal input, .modal textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #010409;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .badge {
            background: #21262d;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        @media (max-width: 780px) {
            th, td { font-size: 11px; padding: 8px 6px; }
            .url-text { max-width: 180px; font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <div class="btn-group">
            <button class="btn-ghost" onclick="toggleModal('settingsModal')">⚙️ R2 配置</button>
            <button class="btn-green" onclick="syncToR2()">⬆️ 上传云端</button>
            <button class="btn-purple" onclick="syncFromR2()">⬇️ 下载云端</button>
            <button class="btn-blue" onclick="checkAll()">⚡ 批量检测 (全部)</button>
            <button class="btn-red" onclick="clearAll()">🗑️ 清空所有</button>
        </div>
        <textarea id="urlInput" placeholder="批量导入接口地址 (每行一个 URL)&#10;支持 http/https，系统会自动通过代理检测，不再出现混合内容报错"></textarea>
        <button class="btn-blue" onclick="importURLs()">📥 智能导入 (自动去重)</button>
        <p class="warning-text">✅ 优化说明：全量请求通过稳定CORS代理检测，真实获取HTTP状态码，不再误报；每个接口支持单独检测 + 一键复制链接。</p>
    </div>

    <div style="overflow-x: auto;">
        <table id="sourceTable">
            <thead>
                <tr><th>#</th><th>名称</th><th>接口地址</th><th>延迟/状态</th><th width="150">操作</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <footer>⚡ 检测使用多代理轮询 (corsproxy.io / allorigins 等) | 延迟为真实响应时间 | 支持云端备份</footer>
</div>

<!-- R2 设置模态框 -->
<div class="overlay" id="overlay" onclick="closeAllModals()"></div>
<div class="modal" id="settingsModal">
    <h3>🔐 Cloudflare R2 设置</h3>
    <input type="text" id="r2_endpoint" placeholder="Endpoint (例: your-account.r2.cloudflarestorage.com)">
    <input type="text" id="r2_accessKeyId" placeholder="Access Key ID">
    <input type="password" id="r2_secretAccessKey" placeholder="Secret Access Key">
    <input type="text" id="r2_bucket" placeholder="Bucket 名称">
    <button class="btn-green" style="width:100%" onclick="saveSettings()">保存配置</button>
</div>

<!-- 编辑接口 -->
<div class="modal" id="editModal">
    <h3>✏️ 编辑接口</h3>
    <input type="hidden" id="editIndex">
    <input type="text" id="editName" placeholder="接口名称">
    <input type="text" id="editUrl" placeholder="完整 URL (http/https)">
    <button class="btn-blue" style="width:100%" onclick="submitEdit()">确认修改</button>
</div>

<script>
    // ---------- 全局数据 ----------
    let sources = JSON.parse(localStorage.getItem('tvbox_sources') || '[]');
    let r2Config = JSON.parse(localStorage.getItem('r2_config') || '{}');

    // ---------- 稳定的 CORS 代理列表 (真实返回状态码) ----------
    const PROXY_LIST = [
        { name: 'corsproxy', url: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}` },
        { name: 'allorigins', url: (target) => `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}` },
        { name: 'cors-anywhere', url: (target) => `https://cors-anywhere.herokuapp.com/${target}` },
        { name: 'thingproxy', url: (target) => `https://thingproxy.freeboard.io/fetch/${target}` }
    ];

    // 辅助: HTML 转义 (防止XSS)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // ---------- 核心检测: 单个接口通过代理获取真实状态码 (忽略no-cors坑) ----------
    async function testSingleUrl(targetUrl, timeoutMs = 7000) {
        // 空url直接离线
        if (!targetUrl || !targetUrl.startsWith('http')) {
            return { online: false, latency: 9999, error: 'invalid url' };
        }
        // 尝试每个代理，只要有一个成功且响应状态2xx即视为在线
        for (const proxy of PROXY_LIST) {
            const proxyUrl = proxy.url(targetUrl);
            const start = Date.now();
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                const response = await fetch(proxyUrl, {
                    method: 'GET',
                    mode: 'cors',        // 关键: 需要读取响应状态码
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json, text/plain, */*' }
                });
                clearTimeout(timeoutId);
                const latency = Date.now() - start;
                // 请求成功且HTTP状态码为2xx 或 304 视为有效接口
                if (response.ok || response.status === 304) {
                    return { online: true, latency: Math.min(latency, 5000) };
                }
                // 针对 allorigins 特殊处理: 它始终返回200但内容可能包含"error"，但因为检测可达性为主，忽略深内容，保守采用状态码即可
                // 如果响应状态非2xx, 继续尝试下一个代理
                console.warn(`代理 ${proxy.name} 返回状态 ${response.status}, 继续尝试`);
            } catch (err) {
                console.debug(`代理 ${proxy.name} 失败: ${err.message}`);
                // 继续下一个代理
            }
        }
        // 所有代理都失败 -> 离线
        return { online: false, latency: 9999 };
    }

    // ---------- 批量检测 (顺序执行, 实时更新UI，支持跳过失败继续) ----------
    async function checkAll() {
        if (sources.length === 0) {
            alert('暂无接口，请先导入');
            return;
        }
        // 将所有接口状态置为检测中
        for (let i = 0; i < sources.length; i++) {
            sources[i].status = 'checking';
            sources[i].latency = null;
        }
        renderTable();

        for (let i = 0; i < sources.length; i++) {
            const item = sources[i];
            item.status = 'checking';
            renderTable(); // 实时刷新状态

            const result = await testSingleUrl(item.url, 6000);
            item.status = result.online ? 'online' : 'offline';
            item.latency = result.online ? result.latency : null;
            renderTable(); // 更新当前行
            // 短暂延迟避免请求太密集
            await new Promise(r => setTimeout(r, 150));
        }
        // 全部检测完成后按照延迟排序 (在线优先，在线内按延迟升序，离线排最后)
        sources.sort((a, b) => {
            if (a.status === 'online' && b.status !== 'online') return -1;
            if (a.status !== 'online' && b.status === 'online') return 1;
            if (a.status === 'online' && b.status === 'online') return (a.latency || 9999) - (b.latency || 9999);
            return 0;
        });
        saveAndRender();
        const onlineCount = sources.filter(s => s.status === 'online').length;
        alert(`检测完成！在线: ${onlineCount} / 总数: ${sources.length}`);
    }

    // ---------- 单独检测某个索引 ----------
    async function checkSingle(index) {
        if (!sources[index]) return;
        const item = sources[index];
        // 设置检测中状态
        item.status = 'checking';
        item.latency = null;
        renderTable();

        const result = await testSingleUrl(item.url, 6000);
        item.status = result.online ? 'online' : 'offline';
        item.latency = result.online ? result.latency : null;
        saveAndRender();
        // 弹出简短反馈
        const msg = result.online ? `✅ 在线 | 延迟 ${result.latency}ms` : `❌ 离线或不可达 (代理均失败)`;
        alert(`接口: ${item.name}\n${msg}`);
    }

    // ---------- 复制链接 ----------
    async function copyUrl(url) {
        try {
            await navigator.clipboard.writeText(url);
            alert('✅ 已复制接口地址到剪贴板');
        } catch (err) {
            // fallback
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('✅ 已复制 (兼容模式)');
        }
    }

    // ---------- 导入URL (智能去重: name 和 url 都不能重复) ----------
    function importURLs() {
        const val = document.getElementById('urlInput').value.trim();
        if (!val) return;
        const lines = val.split(/\r?\n/);
        let addedCount = 0;
        let skipCount = 0;
        for (const line of lines) {
            let url = line.trim();
            if (!url.startsWith('http')) continue;
            // 生成默认名称: 从url提取域名或最后路径
            let name = '';
            try {
                const urlObj = new URL(url);
                name = urlObj.hostname.replace(/^www\./, '');
                if (name.length < 3) name = urlObj.pathname.split('/').filter(p => p).pop() || '接口';
            } catch(e) {
                name = '未知接口';
            }
            // 防止名称过长
            if (name.length > 30) name = name.substring(0, 28) + '..';
            // 查重 (网址严格唯一, 名称也不能重复)
            const isUrlExist = sources.some(s => s.url === url);
            const isNameExist = sources.some(s => s.name === name);
            if (isUrlExist) {
                skipCount++;
                continue;
            }
            if (isNameExist) {
                // 如果名称重复则添加随机后缀
                let newName = name + '_' + Math.floor(Math.random() * 1000);
                while (sources.some(s => s.name === newName)) {
                    newName = name + '_' + Math.floor(Math.random() * 10000);
                }
                name = newName;
            }
            sources.push({
                name: name,
                url: url,
                status: 'wait',
                latency: null
            });
            addedCount++;
        }
        if (addedCount === 0 && skipCount > 0) alert(`已跳过 ${skipCount} 条重复网址/名称`);
        else if (addedCount > 0) alert(`成功导入 ${addedCount} 个接口，跳过 ${skipCount} 个重复项`);
        document.getElementById('urlInput').value = '';
        saveAndRender();
    }

    // ---------- 编辑 & 查重 ----------
    function openEditModal(index) {
        document.getElementById('editIndex').value = index;
        document.getElementById('editName').value = sources[index].name;
        document.getElementById('editUrl').value = sources[index].url;
        toggleModal('editModal');
    }

    function submitEdit() {
        const index = parseInt(document.getElementById('editIndex').value);
        let newName = document.getElementById('editName').value.trim();
        let newUrl = document.getElementById('editUrl').value.trim();
        if (!newName || !newUrl) {
            alert('名称和URL不能为空');
            return;
        }
        if (!newUrl.startsWith('http')) {
            alert('URL必须以http://或https://开头');
            return;
        }
        // 查重 (排除自身)
        const duplicateUrl = sources.some((item, idx) => idx !== index && item.url === newUrl);
        if (duplicateUrl) {
            alert('该网址已存在，请勿重复添加');
            return;
        }
        const duplicateName = sources.some((item, idx) => idx !== index && item.name === newName);
        if (duplicateName) {
            alert('该名称已存在，请修改名称');
            return;
        }
        sources[index].name = newName;
        sources[index].url = newUrl;
        // 编辑后重置状态 (等待下次检测)
        sources[index].status = 'wait';
        sources[index].latency = null;
        closeAllModals();
        saveAndRender();
    }

    function deleteSource(index) {
        if (confirm(`删除接口 "${sources[index].name}" ？`)) {
            sources.splice(index, 1);
            saveAndRender();
        }
    }

    function clearAll() {
        if (confirm('⚠️ 清空所有接口数据，不可撤销，确定吗？')) {
            sources = [];
            saveAndRender();
        }
    }

    // ---------- R2 同步 (AWS SDK v2 修复版) ----------
    function getS3() {
        if (!r2Config.accessKeyId || !r2Config.endpoint || !r2Config.bucket) return null;
        return new AWS.S3({
            endpoint: `https://${r2Config.endpoint}`,
            accessKeyId: r2Config.accessKeyId,
            secretAccessKey: r2Config.secretAccessKey,
            signatureVersion: 'v4',
            region: 'auto',
            s3ForcePathStyle: false
        });
    }

    async function syncToR2() {
        const s3 = getS3();
        if (!s3) return alert('请先填写完整的 R2 配置 (端点/密钥/bucket)');
        try {
            await s3.putObject({
                Bucket: r2Config.bucket,
                Key: "tvbox_data.json",
                Body: JSON.stringify(sources, null, 2),
                ContentType: "application/json"
            }).promise();
            alert('✅ 数据已上传至 R2 (tvbox_data.json)');
        } catch (e) {
            alert('❌ 上传失败: ' + (e.message || '未知错误'));
            console.error(e);
        }
    }

    async function syncFromR2() {
        const s3 = getS3();
        if (!s3) return alert('请先填写完整的 R2 配置');
        try {
            const data = await s3.getObject({ Bucket: r2Config.bucket, Key: "tvbox_data.json" }).promise();
            const remoteData = JSON.parse(new TextDecoder().decode(data.Body));
            if (Array.isArray(remoteData)) {
                sources = remoteData;
                saveAndRender();
                alert('✅ 从云端下载成功，已覆盖本地数据');
            } else {
                alert('云端数据格式错误');
            }
        } catch (e) {
            alert('❌ 下载失败: ' + (e.message || '文件不存在或网络错误'));
        }
    }

    // ---------- UI 渲染 (含单独检测+复制按钮) ----------
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!sources.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px;">暂无接口，请从上方导入或同步云端</td></tr>';
            return;
        }
        tbody.innerHTML = sources.map((item, idx) => {
            const isHttp = item.url && item.url.startsWith('http:');
            let statusText = '';
            let statusClass = '';
            if (item.status === 'online') {
                statusText = `${item.latency}ms`;
                statusClass = 'online';
            } else if (item.status === 'offline') {
                statusText = '超时/离线';
                statusClass = 'offline';
            } else if (item.status === 'checking') {
                statusText = '检测中...';
                statusClass = '';
            } else {
                statusText = '待检测';
                statusClass = '';
            }
            const dotColor = item.status === 'online' ? '#3fb950' : (item.status === 'checking' ? '#d29922' : '#f85149');
            // 安全显示
            const safeName = escapeHtml(item.name);
            const safeUrl = escapeHtml(item.url);
            return `
            <tr>
                <td style="font-weight:500;">${idx+1}</td>
                <td><strong>${safeName}</strong>${isHttp ? '<div class="warning-text">⚠️ HTTP源(代理检测无混合内容)</div>' : ''}</td>
                <td>
                    <a class="url-text" href="${item.url}" target="_blank" rel="noopener noreferrer" title="${safeUrl}">${safeUrl.length > 60 ? safeUrl.substring(0, 55)+'...' : safeUrl}</a>
                </td>
                <td class="${statusClass}">
                    <span class="status-dot" style="background:${dotColor}"></span>
                    ${statusText}
                </td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn check-single-btn" onclick="checkSingle(${idx})" title="单独检测此接口">🔍 检测</button>
                        <button class="action-btn copy-btn" onclick="copyUrl('${safeUrl.replace(/'/g, "\\'")}')" title="复制接口地址">📋 复制</button>
                        <button class="action-btn" onclick="openEditModal(${idx})" title="编辑">✏️ 编辑</button>
                        <button class="action-btn" style="border-color:#da3633;" onclick="deleteSource(${idx})" title="删除">🗑️ 删除</button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function saveAndRender() {
        localStorage.setItem('tvbox_sources', JSON.stringify(sources));
        renderTable();
    }

    // ---------- 设置相关 ----------
    function saveSettings() {
        const endpoint = document.getElementById('r2_endpoint').value.trim();
        const accessKeyId = document.getElementById('r2_accessKeyId').value.trim();
        const secretAccessKey = document.getElementById('r2_secretAccessKey').value.trim();
        const bucket = document.getElementById('r2_bucket').value.trim();
        if (!endpoint || !accessKeyId || !secretAccessKey || !bucket) {
            alert('请填写所有 R2 配置项');
            return;
        }
        r2Config = { endpoint, accessKeyId, secretAccessKey, bucket };
        localStorage.setItem('r2_config', JSON.stringify(r2Config));
        closeAllModals();
        alert('R2 配置已保存');
    }

    function toggleModal(id) {
        document.getElementById(id).style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }
    function closeAllModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
    }

    // 初始化加载设置到输入框
    function initSettingsForm() {
        if (r2Config.endpoint) {
            document.getElementById('r2_endpoint').value = r2Config.endpoint;
            document.getElementById('r2_accessKeyId').value = r2Config.accessKeyId;
            document.getElementById('r2_secretAccessKey').value = r2Config.secretAccessKey;
            document.getElementById('r2_bucket').value = r2Config.bucket;
        }
    }

    // 兼容全局函数调用 (挂载到window)
    window.checkAll = checkAll;
    window.checkSingle = checkSingle;
    window.copyUrl = copyUrl;
    window.importURLs = importURLs;
    window.openEditModal = openEditModal;
    window.submitEdit = submitEdit;
    window.deleteSource = deleteSource;
    window.clearAll = clearAll;
    window.syncToR2 = syncToR2;
    window.syncFromR2 = syncFromR2;
    window.saveSettings = saveSettings;
    window.toggleModal = toggleModal;
    window.closeAllModals = closeAllModals;

    // 启动渲染
    initSettingsForm();
    // 若旧数据没有status字段则统一置为wait
    let needSave = false;
    for (let s of sources) {
        if (!s.status) { s.status = 'wait'; needSave = true; }
        if (s.latency === undefined) s.latency = null;
    }
    if (needSave) saveAndRender();
    else renderTable();
</script>
</body>
</html>
